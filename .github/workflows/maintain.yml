name: Maintain APT repo

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - rebuild-index
          - resync-assets
          - remove-package
          - clean-pool
          - freeze-package
          - unfreeze-package
      package:
        description: 'Package name — required for remove-package, freeze-package, unfreeze-package'
        required: false
        type: string
      version:
        description: 'Version — unused, kept for compatibility'
        required: false
        type: string
      product:
        description: 'Product — required except for rebuild-index and resync-assets'
        required: false
        type: string
      suite:
        description: 'Suite — required except for rebuild-index and resync-assets'
        required: false
        type: string
      pattern:
        description: 'Glob pattern for clean-pool (e.g. "omakasui-lazygit*")'
        required: false
        type: string

jobs:
  maintain:
    name: Maintain APT repo
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate inputs
        run: |
          ACTION="${{ inputs.action }}"
          if [[ "$ACTION" != "rebuild-index" && "$ACTION" != "resync-assets" && ( -z "${{ inputs.product }}" || -z "${{ inputs.suite }}" ) ]]; then
            echo "ERROR: product and suite are required"; exit 1
          fi
          case "$ACTION" in
            remove-package)
              if [[ -z "${{ inputs.package }}" ]]; then
                echo "ERROR: package is required for remove-package"; exit 1
              fi
              ;;
            clean-pool)
              if [[ -z "${{ inputs.pattern }}" ]]; then
                echo "ERROR: pattern is required for clean-pool"; exit 1
              fi
              ;;
            freeze-package)
              if [[ -z "${{ inputs.package }}" ]]; then
                echo "ERROR: package is required for freeze-package"; exit 1
              fi
              ;;
            unfreeze-package)
              if [[ -z "${{ inputs.package }}" ]]; then
                echo "ERROR: package is required for unfreeze-package"; exit 1
              fi
              ;;
            rebuild-index)
              echo "Rebuilding index from existing packages.tsv."
              ;;
            resync-assets)
              echo "Realigning metadata with published release assets."
              ;;
          esac

      - name: Setup APT tools and GPG key
        id: setup-apt
        uses: ./.github/actions/setup-apt
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: '[remove-package] Remove entries from index manifest'
        if: inputs.action == 'remove-package'
        run: |
          bash scripts/remove-entries.sh \
            --package "${{ inputs.package }}" \
            --product "${{ inputs.product }}" \
            --suite   "${{ inputs.suite }}"

      - name: '[clean-pool] Remove entries matching pattern from index manifest'
        if: inputs.action == 'clean-pool'
        run: |
          bash scripts/remove-entries.sh \
            --pattern "${{ inputs.pattern }}" \
            --product "${{ inputs.product }}" \
            --suite   "${{ inputs.suite }}"

      - name: '[rebuild-index] no-op'
        if: inputs.action == 'rebuild-index'
        run: echo "Rebuilding index from existing index/packages.tsv."

      - name: '[resync-assets] Realign index and legacy suites with release assets'
        id: resync
        if: inputs.action == 'resync-assets'
        env:
          GH_TOKEN: ${{ secrets.BUILD_OMAKASUI_DISPATCH_TOKEN }}
        run: bash scripts/resync-assets.sh

      - name: '[freeze-package] Add to freeze.list'
        if: inputs.action == 'freeze-package'
        run: |
          touch index/freeze.list
          ENTRY="${{ inputs.product }} ${{ inputs.suite }} ${{ inputs.package }}"
          grep -qxF "$ENTRY" index/freeze.list || echo "$ENTRY" >> index/freeze.list
          sort -o index/freeze.list index/freeze.list
          echo "Frozen: ${{ inputs.product }}/${{ inputs.suite }}/${{ inputs.package }}"

      - name: '[unfreeze-package] Remove from freeze.list'
        if: inputs.action == 'unfreeze-package'
        run: |
          sed -i "/^${{ inputs.product }} ${{ inputs.suite }} ${{ inputs.package }}$/d" index/freeze.list
          echo "Unfrozen: ${{ inputs.product }}/${{ inputs.suite }}/${{ inputs.package }}"

      - name: Regenerate APT metadata
        if: ${{ !contains(fromJSON('["freeze-package","unfreeze-package"]'), inputs.action) }}
        env:
          GPG_KEY_ID: ${{ steps.setup-apt.outputs.fingerprint }}
        run: |
          touch index/packages.tsv
          bash scripts/update-index.sh
          bash scripts/sign-release.sh --key-id "$GPG_KEY_ID" \
            --legacy-suites "${{ steps.resync.outputs.legacy_suites }}"

      - name: Update README packages table
        run: bash scripts/update-readme.sh

      - name: Build commit message
        id: msg
        run: |
          ACTION="${{ inputs.action }}"
          PKG="${{ inputs.package }}"
          PATTERN="${{ inputs.pattern }}"
          case "$ACTION" in
            remove-package) MSG="maint: remove ${PKG} [$(date '+%Y-%m-%d')]" ;;
            clean-pool)     MSG="maint: clean ${PATTERN} [$(date '+%Y-%m-%d')]" ;;
            resync-assets)  MSG="maint: resync metadata with release assets [$(date '+%Y-%m-%d')]" ;;
            freeze-package)   MSG="maint: freeze ${PKG} [$(date '+%Y-%m-%d')]" ;;
            unfreeze-package) MSG="maint: unfreeze ${PKG} [$(date '+%Y-%m-%d')]" ;;
            *)              MSG="maint: rebuild index [$(date '+%Y-%m-%d')]" ;;
          esac
          echo "value=${MSG}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: ${{ steps.msg.outputs.value }}
