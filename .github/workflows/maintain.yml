name: Maintain APT repo

on:
  workflow_dispatch:
    inputs:
      action:
        description: Maintenance action
        required: true
        type: choice
        options:
          - rebuild-index
          - remove-package
      package:
        description: Package name (required for remove-package)
        required: false
        type: string
      product:
        description: Product (required for remove-package)
        required: false
        type: string
      suite:
        description: Suite (required for remove-package)
        required: false
        type: string

concurrency:
  group: apt-metadata-write
  cancel-in-progress: false

jobs:
  maintain:
    name: Maintain APT repo
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate inputs
        env:
          ACTION: ${{ inputs.action }}
          PACKAGE: ${{ inputs.package }}
          PRODUCT: ${{ inputs.product }}
          SUITE: ${{ inputs.suite }}
        run: |
          if [[ "$ACTION" == remove-package ]]; then
            [[ "$PACKAGE" =~ ^[a-z0-9][a-z0-9+.-]*$ ]] || { echo 'Invalid package'; exit 1; }
            [[ "$PRODUCT" =~ ^[a-z0-9-]+$ ]] || { echo 'Invalid product'; exit 1; }
            [[ "$SUITE" =~ ^[a-z0-9-]+$ ]] || { echo 'Invalid suite'; exit 1; }
          fi

      - name: Setup APT tools and GPG key
        id: setup-apt
        uses: ./.github/actions/setup-apt
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Remove package
        if: inputs.action == 'remove-package'
        env:
          PACKAGE: ${{ inputs.package }}
          PRODUCT: ${{ inputs.product }}
          SUITE: ${{ inputs.suite }}
        run: bash scripts/remove-entries.sh --package "$PACKAGE" --product "$PRODUCT" --suite "$SUITE"

      - name: Generate and sign metadata
        env:
          GPG_KEY_ID: ${{ steps.setup-apt.outputs.fingerprint }}
        run: |
          bash scripts/update-index.sh
          bash scripts/sign-release.sh --key-id "$GPG_KEY_ID"
          bash scripts/update-readme.sh

      - name: Build commit message
        id: message
        env:
          ACTION: ${{ inputs.action }}
          PACKAGE: ${{ inputs.package }}
        run: |
          if [[ "$ACTION" == remove-package ]]; then
            message="maint: remove ${PACKAGE}"
          else
            message="maint: rebuild index"
          fi
          echo "value=${message} [$(date '+%Y-%m-%d')]" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: ${{ steps.message.outputs.value }}
