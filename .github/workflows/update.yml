name: Update APT repo

on:
  repository_dispatch:
    types: [packages-updated]

concurrency:
  group: apt-metadata-write
  cancel-in-progress: false

jobs:
  update:
    name: Publish package batch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate payload
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          jq -e '
            .schema_version == 2 and
            (.catalog | type == "array" and length > 0) and
            (.packages | type == "array" and length > 0) and
            all(.catalog[];
              (.product | test("^[a-z0-9-]+$")) and
              (.suite | test("^[a-z0-9-]+$")) and
              (.label | type == "string" and test("^[A-Za-z0-9_-]+$")) and
              (.status == "active" or .status == "deprecated")) and
            all(.packages[];
              (.package | test("^[a-z0-9][a-z0-9+.-]*$")) and
              (.version | type == "string" and length > 0) and
              (.channel == "stable" or .channel == "dev") and
              (.targets | type == "array" and length > 0) and
              all(.targets[];
                (.product | test("^[a-z0-9-]+$")) and
                (.suite | test("^[a-z0-9-]+$")) and
                (.produces | type == "array" and length > 0) and
                all(.produces[]; test("^[a-z0-9][a-z0-9+.-]*$"))))
          ' <<< "$PAYLOAD" >/dev/null

      - name: Sync target catalog
        env:
          CATALOG: ${{ toJson(github.event.client_payload.catalog) }}
        run: |
          jq -r '.[] | [.product, .suite, .label, .status] | @tsv' <<< "$CATALOG" \
            | tr '\t' ' ' > index/targets.tsv

      - name: Setup APT tools and GPG key
        id: setup-apt
        uses: ./.github/actions/setup-apt
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Register packages
        env:
          GH_TOKEN: ${{ secrets.BUILD_OMAKASUI_DISPATCH_TOKEN }}
          PACKAGES: ${{ toJson(github.event.client_payload.packages) }}
        run: |
          while IFS= read -r entry; do
            package=$(jq -r '.package' <<< "$entry")
            version=$(jq -r '.version' <<< "$entry")
            channel=$(jq -r '.channel' <<< "$entry")

            while IFS= read -r target; do
              product=$(jq -r '.product' <<< "$target")
              suite=$(jq -r '.suite' <<< "$target")
              produces=$(jq -r '.produces | join(" ")' <<< "$target")
              bash scripts/register-package.sh \
                --pkg "$package" --version "$version" \
                --product "$product" --suite "$suite" \
                --produces "$produces" --channel "$channel"
            done < <(jq -c '.targets[]' <<< "$entry")
          done < <(jq -c '.[]' <<< "$PACKAGES")

      - name: Generate and sign metadata
        env:
          GPG_KEY_ID: ${{ steps.setup-apt.outputs.fingerprint }}
        run: |
          bash scripts/update-index.sh
          bash scripts/sign-release.sh --key-id "$GPG_KEY_ID"
          bash scripts/update-readme.sh

      - name: Build commit message
        id: message
        env:
          PACKAGES: ${{ toJson(github.event.client_payload.packages) }}
        run: |
          list=$(jq -r '[.[] | "\(.package) \(.version)"] | unique | join(", ")' <<< "$PACKAGES")
          echo "value=apt: ${list} [$(date '+%Y-%m-%d')]" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: ${{ steps.message.outputs.value }}
