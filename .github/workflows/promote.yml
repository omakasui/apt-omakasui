name: Promote packages to stable

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - promote-package
          - promote-all
      package:
        description: 'Package name (required for promote-package)'
        required: false
        type: string
      version:
        description: 'Version — for promote-package only (leave empty to promote all dev versions)'
        required: false
        type: string
      product:
        description: 'Product repository (required for promote-package, optional filter for promote-all)'
        required: false
        type: string
      suite:
        description: 'Base suite (required for promote-package, optional filter for promote-all)'
        required: false
        type: string
      exclude:
        description: 'For promote-all: space-separated package names to exclude from bulk promotion'
        required: false
        type: string

concurrency:
  group: apt-metadata-write
  cancel-in-progress: false

jobs:
  promote:
    name: Promote packages to stable
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate inputs
        env:
          ACTION: ${{ inputs.action }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          PRODUCT: ${{ inputs.product }}
          SUITE: ${{ inputs.suite }}
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          if [[ "$ACTION" == promote-package ]]; then
            [[ "$PACKAGE" =~ ^[a-z0-9][a-z0-9+.-]*$ ]] || { echo 'Invalid package'; exit 1; }
            [[ -z "$VERSION" || "$VERSION" =~ ^[a-zA-Z0-9.+:~-]+$ ]] || { echo 'Invalid version'; exit 1; }
            [[ "$PRODUCT" =~ ^[a-z0-9-]+$ ]] || { echo 'Invalid product'; exit 1; }
            [[ "$SUITE" =~ ^[a-z0-9-]+$ ]] || { echo 'Invalid suite'; exit 1; }
          else
            [[ -z "$PRODUCT" || "$PRODUCT" =~ ^[a-z0-9-]+$ ]] || { echo 'Invalid product'; exit 1; }
            [[ -z "$SUITE" || "$SUITE" =~ ^[a-z0-9-]+$ ]] || { echo 'Invalid suite'; exit 1; }
            for package in $EXCLUDE; do
              [[ "$package" =~ ^[a-z0-9][a-z0-9+.-]*$ ]] || { echo 'Invalid excluded package'; exit 1; }
            done
          fi

      - name: Setup APT tools and GPG key
        id: setup-apt
        uses: ./.github/actions/setup-apt
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Promote package in index manifest
        if: inputs.action == 'promote-package'
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          PRODUCT: ${{ inputs.product }}
          SUITE: ${{ inputs.suite }}
        run: |
          bash scripts/promote-packages.sh \
            --pkg "$PACKAGE" --version "$VERSION" \
            --product "$PRODUCT" --suite "$SUITE"

      - name: Promote all dev packages to stable
        if: inputs.action == 'promote-all'
        env:
          PRODUCT: ${{ inputs.product }}
          SUITE: ${{ inputs.suite }}
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          bash scripts/promote-packages.sh \
            --all --product "$PRODUCT" --suite "$SUITE" --exclude "$EXCLUDE"

      - name: Regenerate APT metadata
        env:
          GPG_KEY_ID: ${{ steps.setup-apt.outputs.fingerprint }}
        run: |
          bash scripts/update-index.sh
          bash scripts/sign-release.sh --key-id "$GPG_KEY_ID"

      - name: Build commit message
        id: msg
        env:
          ACTION: ${{ inputs.action }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          if [[ "$ACTION" == "promote-all" ]]; then
            if [[ -n "$EXCLUDE" ]]; then
              MSG="apt: promote all to stable (excl: ${EXCLUDE}) [$(date '+%Y-%m-%d')]"
            else
              MSG="apt: promote all dev packages to stable [$(date '+%Y-%m-%d')]"
            fi
          else
            if [[ -n "$VERSION" ]]; then
              MSG="apt: promote ${PACKAGE} ${VERSION} to stable [$(date '+%Y-%m-%d')]"
            else
              MSG="apt: promote ${PACKAGE} to stable [$(date '+%Y-%m-%d')]"
            fi
          fi
          echo "value=${MSG}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: ${{ steps.msg.outputs.value }}
