name: Commit and push
description: Commit generated APT metadata and push it to the current branch.

inputs:
  message:
    required: true

runs:
  using: composite
  steps:
    - name: Commit and push
      shell: bash
      env:
        MESSAGE: ${{ inputs.message }}
      run: |
        git config user.name  "omakasui-bot"
        git config user.email "bot@omakasui.org"

        mapfile -t products < <(awk '{print $1}' index/targets.tsv | sort -u)
        git add -f index/ README.md
        for product in "${products[@]}"; do
          git add -f "$product/"
        done

        if git diff --cached --quiet; then
          echo "Nothing to commit."
          exit 0
        fi

        git commit -m "$MESSAGE"
        git push
